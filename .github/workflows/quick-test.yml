name: Quick Test FiniteLoot

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quick-test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Fast unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      # One runner, both toolchains: :paper compiles with Java 25, :neoforge with Java 21. Gradle's
      # toolchain resolver only fetches what the local setup is missing, but CI gives it nothing to
      # fetch by installing both -- keeps runs deterministic and off the foojay mirror. Java 25 is
      # installed last so it stays JAVA_HOME, matching what an upstream release build used.
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: |
          git config core.filemode false
          chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew test --no-daemon --parallel --console=plain
